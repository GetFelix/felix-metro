[package]
name = "felix-metro-sim"
description = "The authority for each city: steps its districts in lockstep and commits every tick to Felix"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
felix-client = "=0.6.1"
felix-metro-core = { path = "../core" }
felix-wire = "=0.6.1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints]
workspace = true
