# What the gateway lets a browser session reach in one city. dev/seed.mjs
# creates these streams for cities `harbor`, `pinecrest` and `lakeside`.

[scope]
field = "city"

# One shard per district. A session follows each with its own slot and shard.
[[scope.streams]]
alias = "events"
name = "metro.events.{scope}"
actions = ["subscribe"]

[[scope.streams]]
alias = "commands"
name = "metro.commands.{scope}"
actions = ["publish"]
# The sim learns who built what from the gateway's stamp.
stamp_sender = true
# A viewer has no publish right here and still joins.
optional = true

# The list of cities, the same in every scope.
[[scope.streams]]
alias = "cities"
name = "metro.cities"
shared = true
actions = ["subscribe"]
# A sign-in whose roles lack it still joins and just has no city list.
optional = true
