# The development stack: a control plane, one broker, a stand-in IdP, a
# one-shot seed that creates the cities, the gateway, the sim and the web app.
# `dev/up.sh` starts it and waits until it is ready.
name: felix-metro

services:
  idp:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/idp.mjs"]
    environment:
      # Browsers sign in on the host, so the issuer is the host's address.
      IDP_ISSUER: http://127.0.0.1:9400
    ports:
      - "127.0.0.1:9400:9400"
    volumes:
      - ./idp.mjs:/app/idp.mjs:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9400/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  controlplane:
    image: ghcr.io/getfelix/felix-controlplane:0.6.0-preview.9
    environment:
      # In-memory store: a restart of the stack starts from nothing.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: dev-bootstrap
      # The dev IdP is plain HTTP on the compose network.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      # The broker and the sim read their tokens once at startup, so the
      # default 15 minutes would end a dev session early.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    # Spelled out because Podman drops a healthcheck an image declares in OCI format.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      idp:
        condition: service_healthy

  seed:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/seed.mjs"]
    environment:
      # Four districts each: a 2 by 2 city, one shard per district.
      METRO_CITIES: ${METRO_CITIES:-harbor:4,pinecrest:4}
    volumes:
      - ./seed.mjs:/app/seed.mjs:ro,z
      - ./state:/state:z
    depends_on:
      controlplane:
        condition: service_healthy

  broker:
    image: ghcr.io/getfelix/felix-broker:0.6.0-preview.9
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT_EXPORT: /state/broker-cert.pem
      # A broker without a node id is not a cluster member, and a stream on it
      # has one shard. Joining as a cluster of one is what gives it four.
      FELIX_NODE_ID: broker-0
      # Peers reach the internal listener here; with one node there are none.
      FELIX_NODE_ADVERTISE_ADDR: 127.0.0.1:5001
      FELIX_INTERNAL_ALLOW_UNAUTHENTICATED: "true"
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      # Acknowledge after the write, so a commit's answer carries its offset.
      FELIX_ACK_ON_COMMIT: "true"
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state:z
      - felix-data:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

  # Atomic commits stay off until the fleet finalizes them, which needs a
  # serving broker.
  finalize:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/finalize.mjs"]
    volumes:
      - ./finalize.mjs:/app/finalize.mjs:ro,z
      - ./state:/state:z
    depends_on:
      broker:
        condition: service_started

  gateway:
    image: ghcr.io/getfelix/felix-gateway:0.7.0
    environment:
      GATEWAY_FELIX_BROKERS: broker:5000
      GATEWAY_FELIX_CA_FILE: /state/broker-cert.pem
      GATEWAY_FELIX_CONTROL_PLANE: http://controlplane:8443
      GATEWAY_TENANT: metro
      GATEWAY_OIDC_ISSUER: http://127.0.0.1:9400
      GATEWAY_OIDC_CLIENT_ID: felix-metro
      RUST_LOG: info
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./scope.toml:/etc/felix-gateway/scope.toml:ro,z
      - ./state:/state:ro,z
    # It reads the broker's certificate, which exists once the broker has
    # started, and the fleet is finalized once that broker serves.
    restart: on-failure
    depends_on:
      finalize:
        condition: service_completed_successfully

  sim:
    build:
      context: ..
      dockerfile: dev/sim.Dockerfile
    environment:
      SIM_FELIX_BROKERS: broker:5000
      SIM_FELIX_CA_FILE: /state/broker-cert.pem
      SIM_FELIX_TOKEN_FILE: /state/sim.token
      SIM_TENANT: metro
      SIM_CITIES: ${SIM_CITIES:-harbor pinecrest}
      SIM_TICKS_PER_SECOND: ${SIM_TICKS_PER_SECOND:-4}
      RUST_LOG: info
    volumes:
      - ./state:/state:ro,z
    restart: on-failure
    depends_on:
      finalize:
        condition: service_completed_successfully

  # Follows every district of every city through the gateway until each has
  # delivered a tick, then writes state/probed for up.sh.
  probe:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/check-ticks.mjs"]
    environment:
      GATEWAY_URL: ws://gateway:8787/ws
      IDP_URL: http://idp:9400
      CHECK_CITIES: ${SIM_CITIES:-harbor pinecrest}
      TICKS: "1"
      READY_S: "120"
      PROBE_FILE: /state/probed
    volumes:
      - ./check-ticks.mjs:/app/check-ticks.mjs:ro,z
      - ./state:/state:z
    depends_on:
      gateway:
        condition: service_started
      sim:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: dev/web.Dockerfile
    ports:
      - "127.0.0.1:8088:80"

volumes:
  felix-data:
