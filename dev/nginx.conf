# The web app, and the gateway behind the same address so the page needs no cross-origin settings: /oidc says how to
# sign in and /ws is the WebSocket.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /oidc {
        proxy_pass http://gateway:8787;
    }

    location = /ws {
        proxy_pass http://gateway:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A session lives as long as the tab; the gateway pings it and closes a quiet one.
        proxy_read_timeout 1d;
    }
}
