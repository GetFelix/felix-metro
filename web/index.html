<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix Metro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #0a0f15;
        --panel: rgba(10, 15, 21, 0.72);
        --line: rgba(255, 255, 255, 0.1);
        --text: #e8eef3;
        --muted: #93a3b1;
        --cyan: hsl(192, 90%, 46%);
        --amber: #ffbe3c;
        --coral: #ff6038;
        --violet: #965ce6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--text);
        font:
          500 14px/1.4 Inter,
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .chip {
        position: fixed;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px 8px 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .brand {
        top: 16px;
        left: 16px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .brand img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }
      .brand small {
        display: block;
        font-weight: 500;
        color: var(--muted);
        font-size: 12px;
      }
      .brand-button {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
        cursor: pointer;
      }
      .brand-button:disabled {
        color: inherit;
        cursor: default;
      }
      .brand-button:focus-visible,
      .cities a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
        border-radius: 6px;
      }
      .chevron {
        width: 7px;
        height: 7px;
        margin: -3px 2px 0 4px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
      }
      .brand-button[aria-expanded='true'] .chevron {
        margin-top: 3px;
        transform: rotate(225deg);
      }
      .cities {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 6px;
        list-style: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .cities a {
        display: block;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        white-space: nowrap;
      }
      .cities a:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .cities a[aria-current='page'] {
        color: var(--cyan);
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--void);
        transition: opacity 0.6s ease;
      }
      .loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .notice {
        position: fixed;
        inset: 42% 24px auto;
        z-index: 5;
        margin: 0;
        text-align: center;
        color: var(--muted);
        font-size: 18px;
        text-shadow: 0 1px 12px var(--void);
        pointer-events: none;
      }
      .loader p {
        margin: 0;
        color: var(--muted);
      }
      .loader-grid {
        display: grid;
        grid-template-columns: repeat(var(--side, 2), 28px);
        gap: 6px;
      }
      .loader-grid i {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        transition:
          background 0.35s ease,
          box-shadow 0.35s ease;
      }
      .loader-grid i.on {
        background: var(--cyan);
        box-shadow: 0 0 14px hsla(192, 90%, 46%, 0.55);
      }
      @media (prefers-reduced-motion: reduce) {
        .loader,
        .loader-grid i {
          transition: none;
        }
      }
      .hud {
        position: fixed;
        top: 74px;
        left: 16px;
        padding: 6px 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        font:
          12px/1.45 'JetBrains Mono',
          monospace;
        white-space: pre;
        pointer-events: none;
      }
      .clock {
        top: 16px;
        right: 16px;
        padding: 8px 14px;
        font:
          500 20px/1 'JetBrains Mono',
          monospace;
      }
      .clock span {
        color: var(--muted);
        font:
          500 12px Inter,
          sans-serif;
        margin-right: 6px;
      }
      .pill {
        margin-left: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(255, 96, 56, 0.18);
        color: var(--coral);
        font:
          600 11px/1 Inter,
          sans-serif;
        letter-spacing: 0.06em;
        animation: breathe 2s ease-in-out infinite;
      }
      .pill.late {
        background: rgba(255, 190, 60, 0.16);
        color: var(--amber);
        letter-spacing: 0;
      }
      @keyframes breathe {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pill {
          animation: none;
        }
      }
      .timeline[data-live] input {
        pointer-events: none;
      }
      .timeline {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(720px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 12px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .track {
        position: relative;
        height: 22px;
      }
      .track input {
        position: absolute;
        inset: 0;
        width: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .rail {
        position: absolute;
        left: 0;
        right: 0;
        top: 9px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--coral) var(--p), var(--violet) var(--p));
        box-shadow: 0 0 12px rgba(150, 92, 230, 0.35);
      }
      .knob {
        position: absolute;
        top: 3px;
        left: var(--p);
        width: 16px;
        height: 16px;
        margin-left: -8px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 14px var(--amber);
        pointer-events: none;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font:
          500 11px 'JetBrains Mono',
          monospace;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 600px) {
        .brand small {
          display: none;
        }
        .clock {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" role="status">
      <div class="loader-grid" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>
    <p class="notice hidden" id="notice" role="alert">
      We couldn’t find that city, or you can’t open it. Choose another from the Felix Metro menu.
    </p>
    <div class="chip brand" id="brand">
      <img src="brand/felix-metro-mark.png" alt="" />
      <button
        type="button"
        class="brand-button"
        id="brand-button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="cities"
        disabled
      >
        <span>Felix Metro<small id="subtitle">style frame</small></span>
        <i class="chevron hidden" id="chevron" aria-hidden="true"></i>
      </button>
      <ul class="cities hidden" id="cities" aria-label="Cities"></ul>
    </div>
    <div class="chip clock">
      <span id="day">Day 3</span><b id="clock">18:30</b><i class="pill hidden" id="pill">LIVE</i>
    </div>
    <div class="chip timeline" id="timeline">
      <div class="track" id="track" style="--p: 77%">
        <div class="rail"></div>
        <div class="knob"></div>
        <input id="hour" type="range" min="0" max="24" step="0.05" value="18.5" aria-label="Time of day" />
      </div>
      <div class="ticks">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
