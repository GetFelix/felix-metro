<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix Metro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/kit.css" />
    <link rel="stylesheet" href="/src/ui/brand.css" />
    <link rel="stylesheet" href="/src/ui/loader.css" />
    <link rel="stylesheet" href="/src/ui/clock.css" />
    <link rel="stylesheet" href="/src/ui/council.css" />
    <link rel="stylesheet" href="/src/ui/timeline.css" />
    <link rel="stylesheet" href="/src/ui/sheet.css" />
    <link rel="stylesheet" href="/src/ui/toast.css" />
    <link rel="stylesheet" href="/src/ui/photo.css" />
  </head>
  <body>
    <div class="loader" id="loader" role="status">
      <div class="loader-grid" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>
    <p class="notice hidden" id="notice" role="alert">
      We couldn’t find that city, or you can’t open it. Choose another from the Felix Metro menu.
    </p>
    <div class="chip brand" id="brand">
      <img src="brand/felix-metro-mark.png" alt="" />
      <button
        type="button"
        class="brand-button"
        id="brand-button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="cities"
        disabled
      >
        <span>Felix Metro<small id="subtitle">style frame</small></span>
        <i class="chevron hidden" id="chevron" aria-hidden="true"></i>
      </button>
      <ul class="cities hidden" id="cities" aria-label="Cities"></ul>
    </div>
    <div class="corner">
      <div class="chip clock">
        <span id="day">Day 3</span><b id="clock">18:30</b><i class="pill hidden" id="pill">LIVE</i
        ><span class="past hidden" id="past"
          ><button type="button" id="play">Play</button><span id="past-rate" class="rate" hidden></span
          ><span id="past-ago"></span><span aria-hidden="true"> · </span
          ><button type="button" id="back-live">Back to live</button></span
        >
      </div>
      <div class="chip funds hidden" id="funds-chip"><span>Funds</span><b id="funds">$0</b></div>
      <div class="chip council hidden" id="council-chip"></div>
    </div>
    <div class="chip timeline" id="timeline">
      <div class="scrub hidden" id="scrub"></div>
      <div class="track" id="track" style="--p: 77%">
        <div class="rail"></div>
        <div class="knob"></div>
        <input id="hour" type="range" min="0" max="24" step="0.05" value="18.5" aria-label="Time of day" />
      </div>
      <div class="ticks">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
      </div>
    </div>
    <div class="toasts" id="toasts" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
