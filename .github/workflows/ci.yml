name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frame:
    name: style frame
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The app and the style frame it was ported from, at the same frozen moments, in headless Chromium on SwiftShader.
      - name: The app matches the style frame
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory .. &
          for port in 4173 4174; do
            up=0
            for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/" >/dev/null && up=1 && break; sleep 1; done
            [[ $up -eq 1 ]] || { echo "nothing is serving on port $port" >&2; exit 1; }
          done
          failed=0
          for t in 6.8 12 17.8 18.7 21; do
            FRAME_T=$t npm run frame -- http://127.0.0.1:4173/ http://127.0.0.1:4174/prototype/style-frame.html "frames/t-$t" || failed=1
          done
          exit $failed
        env:
          FRAME_MAX_DIFFERING_PERCENT: '0.01'
      # Every GLB under prototype/assets/models loads and clones through src/models.ts.
      - name: Every model loads
        run: |
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4175/" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4175" >&2; exit 1; }
          npm run models -- http://127.0.0.1:4175/models.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: web/frames

  rust-fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  rust-clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p felix-metro-core --lib --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
