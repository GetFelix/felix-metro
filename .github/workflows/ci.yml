name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # core/ in WebAssembly, and records from a native run for the tests to decode.
      - run: npm run core
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Serve it with `python3 -m http.server` from the download.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  frame:
    name: style frame
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The type check behind the build reads the core test, so core/ is built here too.
      - run: npm run core
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The app and the style frame it was ported from, at the same frozen moments, in headless Chromium on SwiftShader.
      - name: The app matches the style frame
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory .. &
          for port in 4173 4174; do
            up=0
            for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/" >/dev/null && up=1 && break; sleep 1; done
            [[ $up -eq 1 ]] || { echo "nothing is serving on port $port" >&2; exit 1; }
          done
          failed=0
          for t in 6.8 12 17.8 18.7 21; do
            FRAME_T=$t npm run frame -- 'http://127.0.0.1:4173/?layout=frame' http://127.0.0.1:4174/prototype/style-frame.html "frames/t-$t" || failed=1
          done
          exit $failed
        env:
          FRAME_MAX_DIFFERING_PERCENT: '0.01'
      # The same moment on each quality tier, and with the frame-time HUD, for review.
      - name: Quality tier screenshots
        run: |
          npx vite preview --host 127.0.0.1 --port 4176 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4176/" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4176" >&2; exit 1; }
          node scripts/shoot-tiers.mjs http://127.0.0.1:4176/ frames/tiers
      # Slow frames, no ?tier and no ?still: the automatic choice must step high, medium, low and free what it drops.
      - name: Automatic step-down
        run: |
          npx vite preview --host 127.0.0.1 --port 4177 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4177/" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4177" >&2; exit 1; }
          node scripts/check-quality.mjs http://127.0.0.1:4177/
      # Every GLB under prototype/assets/models loads and clones through src/models.ts.
      - name: Every model loads
        run: |
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:4175/" >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4175" >&2; exit 1; }
          npm run models -- http://127.0.0.1:4175/models.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: web/frames

  rust-fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  rust-clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p felix-metro-core --lib --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  sim:
    name: sim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p felix-metro-sim --test day --locked --no-run
      # A broker (a cluster of one, for shards) with a stream of four shards for the city, and a token for the sim.
      - run: sim/ci/up.sh
      # A simulated day, 5760 ticks, in every district, then a short run through pause and every speed; read back from the broker.
      - name: A city runs a day with every tick in every district
        timeout-minutes: 12
        run: cargo test -p felix-metro-sim --test day --locked -- --ignored --nocapture
        env:
          METRO_TEST_CA_FILE: ${{ github.workspace }}/sim/ci/state/broker-cert.pem
          METRO_TEST_TOKEN_FILE: ${{ github.workspace }}/sim/ci/state/sim.token
      - if: failure()
        run: docker compose -f sim/ci/compose.yml logs --no-color

  dev-stack:
    name: dev-stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Felix, the gateway, the sim for harbor and pinecrest, and the web app, all built and started from dev/compose.yml.
      - run: dev/up.sh
      # A client signs in through the IdP, joins each city at the gateway and follows every district's shard live.
      - name: Ticks reach a WebSocket client through the gateway
        run: node dev/check-ticks.mjs harbor pinecrest
      # The speed endpoint is loopback only, so dev/speed.sh runs curl inside the sim's container.
      - name: The speed can be set from inside the sim
        run: |
          dev/speed.sh harbor 16
          [[ "$(dev/speed.sh harbor)" == "16" ]]
          dev/speed.sh harbor 4
      # The page at /#harbor signs in as `viewer`, follows the city through the gateway and draws it: the tick on
      # screen advances, cars are drawn and move, and the sun follows the tick. The sim runs at 4x so the commute and
      # the evening arrive in minutes. Screenshots of a day moment, dusk and a street are in the artifact.
      - name: The page shows residents commuting in time with the sim
        working-directory: web
        timeout-minutes: 30
        run: |
          npm ci
          npx playwright install --with-deps chromium
          ../dev/speed.sh harbor 16
          node scripts/check-live.mjs 'http://127.0.0.1:8088/?tier=medium#harbor' live-frames
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-city
          path: web/live-frames
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color
