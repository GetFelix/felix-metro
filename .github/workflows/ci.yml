name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frame:
    name: style frame
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The app and the style frame it was ported from, at the same frozen moments, in headless Chromium on SwiftShader.
      - name: The app matches the style frame
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory .. &
          for port in 4173 4174; do
            up=0
            for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/" >/dev/null && up=1 && break; sleep 1; done
            [[ $up -eq 1 ]] || { echo "nothing is serving on port $port" >&2; exit 1; }
          done
          for extra in '&tier=high'; do t=12
            FRAME_EXTRA=$extra FRAME_T=$t npm run frame -- http://127.0.0.1:4173/ http://127.0.0.1:4174/prototype/style-frame.html "frames/x${extra#&tier=}"
          done
        env:
          FRAME_MAX_DIFFERING_PERCENT: '100'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: web/frames
