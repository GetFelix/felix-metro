name: Lockfile (throwaway)

on:
  push:
    branches: [web-skeleton]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: web
        run: |
          npm install --package-lock-only --registry=https://registry.npmjs.org/
          npm ci
          npx prettier --write .
      - run: |
          git config user.email gabrielloewen@outlook.com
          git config user.name "Gabriel Loewen"
          git add -A web
          git diff --cached --quiet || git commit -m "chore(web): lockfile and prettier formatting"
          git push
