name: Clip

# Records the clip for getfelix.dev: the dev stack runs, the page draws the city one frame at a time (web/scripts/clip.mjs)
# and ffmpeg encodes the frames. The sim is held and stepped by the script, and the builder bot raises buildings in the
# development area on camera. The mp4 and its posters are in the artifact, with shots.csv (the clock of each second).
on:
  workflow_dispatch:
    inputs:
      city:
        description: City to film
        default: harbor
      length:
        description: Seconds of video
        default: '30'
      tier:
        description: Quality tier the page draws at (low, medium, high)
        default: medium
      timing:
        description: Only time a few frames at each tier, no clip
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      CITY: ${{ inputs.city || 'harbor' }}
      LENGTH: ${{ inputs.length || '30' }}
      CLIP_TIER: ${{ inputs.tier || 'medium' }}
      # Software GL is slow to screenshot, so the page hands the canvas over as a picture.
      CLIP_PICTURE: '1'
      CLIP_TIMING: ${{ inputs.timing && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The script owns city time: the sim is held from the moment it is live, and the script steps it.
      - run: dev/up.sh
      - run: dev/speed.sh "$CITY" 0
      # The builder bot reads the city's lots from the core crate's city_json example, so this compiles it.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p felix-metro-core --example city_json
      - name: Draw the frames
        working-directory: web
        timeout-minutes: 140
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/clip.mjs 'http://127.0.0.1:8088' "$CITY" "$LENGTH" clip-out
      - name: Encode
        if: ${{ !inputs.timing }}
        working-directory: web/clip-out
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          at="$(node -p "require('./meta.json').posterAt")"
          ffmpeg -y -framerate 30 -i frames/f%05d.jpg -vf scale=in_range=pc:out_range=tv,format=yuv420p -c:v libx264 -profile:v high \
            -crf 32 -maxrate 700k -bufsize 1400k -preset slow -movflags +faststart -an "metro-$CITY.mp4"
          ffmpeg -y -ss "$at" -i "metro-$CITY.mp4" -frames:v 1 -c:v libwebp -quality 82 "metro-$CITY.webp"
          ffmpeg -y -ss "$at" -i "metro-$CITY.mp4" -frames:v 1 -q:v 3 "metro-$CITY.jpg"
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,r_frame_rate,pix_fmt,bit_rate:format=duration,size \
            -of default=nw=1 "metro-$CITY.mp4" | tee specs.txt
      - name: An mp4 was written
        if: ${{ !inputs.timing }}
        run: test -s "web/clip-out/metro-$CITY.mp4"
      # The clip ends back on the live city: no "ago" label, Back to live gone, a live tick on the last row.
      - name: The last shot is live
        if: ${{ !inputs.timing }}
        working-directory: web/clip-out
        run: |
          node -e "
            const m = require('./meta.json');
            const last = require('fs').readFileSync('shots.csv', 'utf8').trim().split('\n').pop().split(',');
            console.log('meta', JSON.stringify(m), 'last row', last.join(','));
            if (m.played && !m.endsLive) { console.error('the clip does not end on the live city'); process.exit(1); }
            if (m.played && !(Number(last[1]) > 0 && last[0] === 'end')) { console.error('shots.csv has no live end row'); process.exit(1); }
          "
      # City time follows the script: between two live shots the clock never moves more than the plan says, and the
      # rewind goes back to before the buildings the bot raised, so they come down on camera.
      - name: The clock follows the script
        if: ${{ !inputs.timing }}
        working-directory: web/clip-out
        run: |
          node -e "
            const m = require('./meta.json');
            const rows = require('fs').readFileSync('shots.csv', 'utf8').trim().split('\n').slice(1).map((l) => l.split(',')).filter((r) => r[0] !== 'end');
            let bad = 0;
            for (let i = 1; i < rows.length; i++) {
              const [a, b] = [rows[i - 1], rows[i]];
              if (a[7] !== 'live' || b[7] !== 'live') continue;
              const d = Number(b[1]) - Number(a[1]);
              if (d < 0 || d > m.maxStep) { console.error('the clock moved', d, 'ticks between video seconds', a[0], 'and', b[0], '(at most', m.maxStep + ')'); bad++; }
            }
            const past = rows.filter((r) => r[7] === 'past' || r[7] === 'drag').map((r) => Number(r[1]));
            console.log('buildings', m.built, 'first at tick', m.firstBuild, 'rewind reached', Math.min(...past), 'max step', m.maxStep);
            if (m.built < 8) { console.error('the bot raised only', m.built); bad++; }
            if (!(Math.min(...past) < m.firstBuild)) { console.error('the rewind did not go back to before the buildings'); bad++; }
            if (bad) process.exit(1);
          "
      # The site wants a clip of 0.5-3 MB.
      - name: The mp4 is a size the site can take
        if: ${{ !inputs.timing }}
        run: |
          size=$(stat -c %s "web/clip-out/metro-$CITY.mp4")
          echo "mp4 is $size bytes"
          test "$size" -ge 500000 && test "$size" -le 3000000
      # A few frames to look at without downloading the whole set.
      - name: Pick sample frames
        if: always()
        working-directory: web/clip-out
        run: |
          mkdir -p samples
          for i in $(seq 0 45 1200); do cp "$(printf 'frames/f%05d.jpg' "$i")" samples/ 2>/dev/null || true; done
          rm -rf frames-all && mv frames frames-all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip
          path: |
            web/clip-out
            !web/clip-out/frames-all
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color
