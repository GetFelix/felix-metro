name: placement-probe
on:
  push:
    branches: [fix/devstack-placement]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hold: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dev/up.sh
        env:
          METRO_BUILDERS: mayor,architect
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: web
        continue-on-error: true
        env:
          PLACEMENT_HOLD: ${{ matrix.hold }}
        run: |
          for i in 1 2 3; do
            ../dev/speed.sh harbor 16
            node scripts/check-placement.mjs 'http://127.0.0.1:8088/?tier=low' live-frames/placement$i 2>&1 | grep -E "opened|not drawn|browser cpu|FAIL|two builders|no progress" || true
          done
